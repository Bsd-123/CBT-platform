<!--
  Paste this HTML into Supabase Dashboard:
  Authentication → Email Templates → Reset Password

  Replace LOGO_URL with one of:
  - Supabase Storage public URL (recommended before production domain)
  - https://YOUR-DOMAIN/brand/logo.png  (after deploy; PNG preferred in email clients)

-->
<div dir="rtl" style="font-family: Inter, Arial, sans-serif; max-width: 560px; margin: 0 auto; color: #0d1c2f;">
  <div style="text-align: center; padding: 24px 0;">
    <img src="LOGO_URL" alt="קהילת מטפלי CBT" width="160" style="max-width: 160px; height: auto;" />
  </div>
  <h2 style="color: #a43c28; margin: 0 0 12px;">איפוס סיסמה</h2>

  <p style="text-align: center; margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}" style="background: #a43c28; color: #ffffff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600;">הגדרת סיסמה חדשה</a>
  </p>
